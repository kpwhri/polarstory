[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'polarstory'
version = '1.2.1'
description = 'Data exploration and profiling with polars'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'polars>=1.44.1',
    'jinja2>=3.1',
    'matplotlib>=3.8',
]

[project.optional-dependencies]
dev = [
    'pytest>=8',
    # great tables testing
    'great-tables',
    # polars output
    'altair',
    'plotnine',
    'vl_convert-python',
    # notebook
    'ipywidgets>=8',
    'ipython>=8',
]
notebook = [
    'ipywidgets>=8',
    'ipython>=8',
]

[project.scripts]
polarstory = 'polarstory.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
polarstory = [
    'templates/*.html',
    'templates/*.css',
]

[tool.pytest.ini_options]
testpaths = ['tests']
