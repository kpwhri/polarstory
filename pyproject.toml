[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'polarstory'
version = '1.0.0'
description = 'polars-native data profiling and static HTML reports'
readme = 'README.md'
requires-python = '>=3.11'
dependencies = [
    'polars>=1.44.1',
    'jinja2>=3.1',
    'matplotlib>=3.8',
]

[project.optional-dependencies]
dev = [
    'pytest>=8',
]

[project.scripts]
polarstory = 'polarstory.cli:main'

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools.package-data]
polarstory = [
    'templates/*.html',
    'templates/*.css',
]

[tool.pytest.ini_options]
testpaths = ['tests']
