name: Tests

on:
  workflow_dispatch:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.14'
            polars: 'polars>=2,<3'
          - os: windows-latest
            python-version: '3.14'
            polars: 'polars>=2,<3'
          - os: ubuntu-latest
            python-version: '3.11'
            polars: 'polars>=1.44.1,<2'
          - os: windows-latest
            python-version: '3.11'
            polars: 'polars>=1.44.1,<2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install '${{ matrix.polars }}'
      - name: Test
        run: python -m pytest -q

  vscode:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check extension JavaScript
        run: npm run check --prefix vscode
      - name: Test extension helpers
        run: npm test --prefix vscode
